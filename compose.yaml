# Banco local de desenvolvimento. A API e o Ollama rodam no computador.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: buno
      POSTGRES_USER: buno
      POSTGRES_PASSWORD: buno_local_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - buno-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buno -d buno"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  buno-postgres:
